<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Siswa - BK MAN 2 Kota Kediri</title>
    <style>
        body {
            background: linear-gradient(135deg, rgba(45, 62, 150, 0.9) 0%, rgba(26, 37, 90, 0.95) 100%), 
            url("{{ url_for('static', filename='1000107070.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh

        }

        /* Overlay gelap supaya gambar sekolahnya tetap kelihatan tapi teks terbaca */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .login-container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 350px;
            text-align: center;
            border-top: 5px solid #2e7d32; /* Aksen Hijau */
        }

        .login-container img {
            width: 80px;
            margin-bottom: 15px;
        }

        .login-container h2 {
            margin: 0 0 20px;
            color: #2e7d32; /* Judul Hijau */
            font-weight: bold;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32; /* Tombol Hijau */
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: #1b5e20;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: #2e7d32;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo MAN 2">
        <h2>LOGIN SISWA</h2>
        <form action="/login_siswa" method="POST">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" name="nama" placeholder="Masukkan Nama Anda, contoh: BERYL ADITYA" required>
                <small style="color: #d32f2f; font-size: 11px; display: block; margin-top: 5px;">
                    *Gunakan HURUF KAPITAL
                </small>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Masukkan Password" required>
            </div>
            <button type="submit" class="btn-login">MASUK</button>
        </form>
        <a href="/" class="back-link">← Kembali ke Beranda</a>
    </div>

</body>
</html>
