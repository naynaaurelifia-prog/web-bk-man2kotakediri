<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Siswa - BK MAN 2 Kota Kediri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%); /* Latar belakang hijau */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: #e3f2fd; /* Warna latar belakang biru muda */
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
            position: relative;
            z-index: 1; /* Pastikan container berada di atas latar belakang */
        }
        .logo-circle {
            background-color: white;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px auto;
            border: 5px solid #ffca28; /* Border kuning */
            position: relative;
            z-index: 2; /* Pastikan logo berada di atas container */
        }
        .logo-circle img {
            width: 90px;
            height: 90px;
        }
        h2 {
            margin-bottom: 30px;
            color: #1b5e20; /* Warna teks hijau gelap */
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #1b5e20;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 25px;
            box-sizing: border-box;
            background-color: #f1f8e9; /* Warna latar belakang input hijau muda */
        }
        .btn {
            background-color: #2e7d32; /* Warna tombol hijau */
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #1b5e20; /* Warna tombol hijau lebih gelap saat hover */
        }
        .footer {
            margin-top: 25px;
            font-size: 14px;
            color: #1b5e20;
        }
        .footer a {
            color: #ff8f00; /* Warna link kuning/oranye */
            text-decoration: none;
            font-weight: bold;
        }
        /* Latar belakang dengan logo samar */
        .background-logo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('{{ url_for('static', filename='logo.png') }}'); /* Ganti dengan path logo Anda */
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            opacity: 0.1; /* Tingkat transparansi logo */
            z-index: 0;
        }
    </style>
</head>
<body>
    <div class="background-logo"></div> <div class="container">
        <div class="logo-circle">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo MAN 2 Kediri">
        </div>
        <h2>LOGIN SISWA</h2>
        <form action="/login_siswa" method="POST">
            <div class="form-group">
                <label for="nis">Nomor Induk Siswa (NIS)</label>
                <input type="text" id="nis" name="nis" placeholder="Masukkan NIS Anda" required>
            </div>
            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" name="password" placeholder="Masukkan Kata Sandi" required>
            </div>
            <button type="submit" class="btn">Masuk</button>
        </form>
        <div class="footer">
            <p>Belum memiliki akun? <a href="/daftar_siswa">Daftar Disini</a></p>
            <p><a href="/">Kembali ke Beranda</a></p>
        </div>
    </div>
</body>
</html>
