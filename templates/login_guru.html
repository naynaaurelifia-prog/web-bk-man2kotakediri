<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Guru BK - MAN 2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        /* Background biru besar seperti di aplikasi utama kamu */
        body { 
            background: #0b4b6b; /* Sesuaikan dengan warna background utama MAN 2 kamu */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }

        /* Card Utama dengan Lengkungan Gede (Padding Pas) */
        .login-card { 
            background: white; 
            border-radius: 30px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            width: 100%; 
            max-width: 420px; 
            overflow: hidden;
            padding-bottom: 30px;
            text-align: center;
        }

        /* Bagian Atas yang Kamu Lingkarin - Diubah jadi Warna BIRU MUDA SKY */
        .card-header { 
            background: #38b6ff; /* Warna Biru Muda Sky */
            padding: 30px 20px;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
            margin-bottom: 30px;
        }
        .card-header h2 { 
            color: white; 
            font-size: 22px; 
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Form Padding Dalam */
        .form-container {
            padding: 0 35px;
        }
        .form-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }
        
        /* Input text & password melengkung tipis transparan/soft */
        input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid #e2e8f0; 
            background-color: #f8fafc;
            border-radius: 15px; 
            outline: none; 
            font-size: 14px; 
            color: #333;
            transition: 0.3s;
        }
        input:focus { 
            border-color: #38b6ff; 
            background-color: #fff;
        }

        /* Tombol Masuk - Ikut Warna Sky Blue */
        button { 
            width: 100%; 
            padding: 14px; 
            background: #38b6ff; /* Warna Sky Blue */
            color: white; 
            border: none; 
            border-radius: 15px; 
            font-size: 15px; 
            font-weight: 700; 
            cursor: pointer; 
            margin-top: 15px; 
            box-shadow: 0 4px 12px rgba(56, 182, 255, 0.3);
            transition: 0.3s; 
        }
        button:hover { 
            background: #1da1f2; 
            transform: translateY(-1px);
        }

        .back-link { 
            display: inline-block; 
            margin-top: 25px; 
            color: #888; 
            text-decoration: none; 
            font-size: 13px; 
            transition: 0.3s;
        }
        .back-link:hover {
            color: #38b6ff;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Bagian Atas: Berwarna Biru Muda Sky & Melengkung ke dalam -->
        <div class="card-header">
            <h2>Masuk sebagai guru</h2>
        </div>

        <!-- Bagian Form Isian -->
        <div class="form-container">
            <form action="/login_guru" method="POST">
                <div class="form-group">
                    <input type="text" name="nama_guru" placeholder="Nama Guru / Akun Guru" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password" placeholder="Password Admin" required>
                </div>
                <button type="submit">Masuk</button>
            </form>
            <a href="/" class="back-link">← Kembali ke Menu Utama</a>
        </div>
    </div>

</body>
</html>
