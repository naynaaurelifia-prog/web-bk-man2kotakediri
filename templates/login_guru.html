<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Guru BK - MAN 2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #0b4b6b; margin-bottom: 10px; font-size: 24px; }
        p { color: #777; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 13px; color: #333; margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 14px; }
        input:focus { border-color: #0b4b6b; }
        button { width: 100%; padding: 12px; background: #0b4b6b; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #083852; }
        .back-link { display: inline-block; margin-top: 20px; color: #0b4b6b; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>LOGIN GURU BK</h2>
        <p>MAN 2 KOTA KEDIRI</p>
        <form action="/login_guru" method="POST">
            <div class="form-group">
                <label>Nama Guru</label>
                <input type="text" name="nama_guru" placeholder="Masukkan Nama Lengkap beserta Gelar" required>
            </div>
            <div class="form-group">
                <label>Password Admin</label>
                <input type="password" name="password" placeholder="Masukkan Password" required>
            </div>
            <button type="submit">MASUK</button>
        </form>
        <a href="/" class="back-link">← Kembali ke Beranda</a>
    </div>

</body>
</html>
