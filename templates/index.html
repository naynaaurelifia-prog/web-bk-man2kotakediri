<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BK MAN 2 KOTA KEDIRI</title>
    <style>
        /* 1. BACKGROUND DENGAN FOTO GEDUNG + FADING GRADASI */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Foto gedung menyatu dengan gradasi biru */
            background: linear-gradient(135deg, rgba(45, 62, 150, 0.85) 0%, rgba(20, 30, 80, 0.95) 100%), 
                        url("{{ url_for('static', filename='1000107070.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            overflow: hidden;
        }

        /* EFEK BLUR TAMBAHAN UNTUK BACKGROUND */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            backdrop-filter: blur(4px); /* Efek fading/blur biar estetik */
            z-index: 1;
        }

        .container {
            width: 85%;
            max-width: 380px;
            text-align: center;
            z-index: 2; /* Biar konten di depan background */
        }

        /* 2. LOGO LINGKARAN DENGAN GOLDEN SHADOW */
        .logo-circle {
            width: 140px;
            height: 140px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 5px solid #FFD700; /* Lingkaran Emas */
            /* Efek Shadow Glowing */
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5), 0 10px 20px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .logo-circle img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        h1 {
            font-size: 1.25em;
            font-weight: bold;
            margin-bottom: 40px;
            line-height: 1.5;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 3. BUTTON BIRU TRANSPARAN + LONJONG + EMOJI */
        .btn {
            text-decoration: none;
            color: white;
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            padding: 15px 25px;
            border-radius: 35px; /* Lonjong sesuai prototipe */
            display: flex;
            align-items: center;
            justify-content: flex-start;
            font-weight: 500;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .btn span {
            margin-right: 15px;
            font-size: 1.3em;
        }

        .btn:hover {
            background: white;
            color: #2d3e96;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-circle">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo MAN 2">
        </div>

        <h1>SELAMAT DATANG DI BK<br>MAN 2 KOTA KEDIRI</h1>

        <div class="menu-buttons">
            <a href="#" class="btn">
                <span>👨‍🎓</span> Masuk sebagai siswa
            </a>
            
            <a href="#" class="btn">
                <span>👩‍🏫</span> Masuk sebagai guru
            </a>
            
            <a href="/petugas" class="btn">
                <span>👮‍♂️</span> Masuk sebagai petugas
            </a>
        </div>
    </div>

</body>
</html>
